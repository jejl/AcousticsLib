[project]
name = "calltrackerslib"
version = "0.10.0"
description = "CallTrackers shared library — audio I/O, database, geography, processing utilities"
readme = "README.md"
authors = [
    { name = "Jim Lovell", email = "jim@astroacoustics.au" }
]
requires-python = ">=3.12"
dependencies = [
    "astropy>=6.0.0",
    "bcrypt>=4.3.0",
    "geopandas>=1.1.0",
    "guano>=1.0.15",
    "loguru>=0.7.3",
    "matplotlib>=3.10.0",
    "numpy>=2.2.0",
    "pandas>=2.0.0",
    "pymysql>=1.1.1",
    "scipy>=1.15.0",
    "shapely>=2.0.0",
    "soundfile>=0.13.0",
    "sqlalchemy>=2.0.0",
    "wavinfo>=4.0.0",
    "pytz>=2026.1.post1",
]

[project.optional-dependencies]
# Shared Dash/Flask UI layer (calltrackerslib.ui). Kept optional so non-UI
# consumers (pipelines, scripts) never pull in a web framework.
ui = [
    "dash>=2.18.0",
    "dash-bootstrap-components>=1.6.0",
    "flask-login>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
